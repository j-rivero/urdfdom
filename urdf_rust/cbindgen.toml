# cbindgen configuration for urdf_rust
language = "C"

header = """/* URDF Rust Library - C FFI Bindings
 * 
 * This header provides C-compatible bindings for the URDF Rust library.
 * Generated automatically by cbindgen from Rust source code.
 */

#ifndef URDF_RUST_H
#define URDF_RUST_H

#ifdef __cplusplus
extern "C" {
#endif

#include <stdint.h>
#include <stddef.h>
#include <stdbool.h>"""

trailer = """
#ifdef __cplusplus
}
#endif

#endif /* URDF_RUST_H */"""

include_guard = "URDF_RUST_H"
tab_width = 4
line_length = 100
documentation = true

[parse]
parse_deps = true

[export]
include = [
  "Vector3",
  "Rotation", 
  "Pose",
  "urdf_vector3_new",
  "urdf_vector3_zero",
  "urdf_vector3_clear",
  "urdf_vector3_init",
  "urdf_vector3_add",
  "urdf_rotation_new",
  "urdf_rotation_identity",
  "urdf_rotation_clear",
  "urdf_rotation_get_quaternion",
  "urdf_rotation_get_rpy",
  "urdf_rotation_set_from_quaternion",
  "urdf_rotation_set_from_rpy", 
  "urdf_rotation_init",
  "urdf_rotation_normalize",
  "urdf_rotation_get_inverse",
  "urdf_rotation_multiply",
  "urdf_rotation_multiply_vector3",
  "urdf_pose_new",
  "urdf_pose_identity", 
  "urdf_pose_clear",
  "urdf_parse_vector3",
  "UrdfGeometryType",
  "urdf_geometry_create_box",
  "urdf_geometry_create_sphere", 
  "urdf_geometry_create_cylinder",
  "urdf_geometry_create_mesh",
  "urdf_geometry_destroy",
  "urdf_geometry_get_type",
  "urdf_geometry_box_get_dimensions",
  "urdf_geometry_sphere_get_radius",
  "urdf_geometry_cylinder_get_radius",
  "urdf_geometry_cylinder_get_length",
  "urdf_geometry_mesh_get_filename",
  "urdf_geometry_mesh_get_scale"
]

[fn]
rename_args = "snake_case"